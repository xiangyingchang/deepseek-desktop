name: macOS Reference Builds

on:
  workflow_dispatch:
    inputs:
      publish_reference_release:
        description: Upload the generated arm64 assets to the existing Reference Release
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }} Reference Client
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host_arch: x86_64
            runner: macos-13
          - arch: arm64
            host_arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout DSH Stack
        uses: actions/checkout@v4

      - name: Checkout pinned official Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: pnpm

      - name: Assert native runner architecture
        run: |
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Install DSH Stack dependencies
        run: pnpm install --frozen-lockfile

      - name: Install official Harness dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Load Reference package-size baseline
        run: |
          baseline=$(node -e "process.stdout.write(String(require('./docs/package-size-report.json').baseline.totalBytes))")
          echo "DSH_STACK_SIZE_BASELINE_BYTES=$baseline" >> "$GITHUB_ENV"

      - name: Build official Harness packages
        working-directory: deepseek-harness
        run: pnpm run build

      - name: Initialize official web Profile
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: CI=true pnpm dsh web --dump-default-config >/dev/null

      - name: Freeze → Verify → Materialize → Package
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DSH_STACK_ARCH: ${{ matrix.arch }}
          DSH_STACK_OUTPUT_DIR: ${{ github.workspace }}/dist/release/${{ matrix.arch }}
          DSH_STACK_TRACE: '1'
        run: bash scripts/build-macos-reference.sh

      - name: Upload unsigned/ad-hoc validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-unofficial-macos-${{ matrix.arch }}
          path: dist/release/${{ matrix.arch }}
          if-no-files-found: error

      - name: Upload arm64 assets to Reference Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_reference_release == true && matrix.arch == 'arm64' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.0-reference-v10 \
            "dist/release/arm64/DeepSeek-Desktop-Unofficial-macOS-Apple-Silicon-arm64.dmg" \
            "dist/release/arm64/DeepSeek-Desktop-Unofficial-macOS-Apple-Silicon-arm64.dmg.sha256" \
            "dist/release/arm64/DeepSeek-Desktop-Unofficial-macOS-Apple-Silicon-arm64-verification.receipt.json" \
            "dist/release/arm64/DeepSeek-Desktop-Unofficial-macOS-Apple-Silicon-arm64-package-size-report.json" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
