name: macOS Reference Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }} Reference Client
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host_arch: x86_64
            node_arch: x64
            runner: macos-13
          - arch: arm64
            host_arch: arm64
            node_arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout DSH Stack
        uses: actions/checkout@v4

      - name: Load current Harness pin
        id: harness-pin
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pin = JSON.parse(fs.readFileSync('config/harness-pin.json', 'utf8'))
          if (pin.schemaVersion !== 1 || !/^[0-9a-f]{40}$/.test(pin.commit) || typeof pin.repository !== 'string' || typeof pin.version !== 'string' || typeof pin.upstreamRef !== 'string' || pin.upstreamRef.length === 0) {
            throw new Error('config/harness-pin.json is invalid')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `repository=${pin.repository}`,
            `version=${pin.version}`,
            `commit=${pin.commit}`,
          ].join('\n') + '\n')
          NODE

      - name: Checkout current official Harness pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.harness-pin.outputs.repository }}
          ref: ${{ steps.harness-pin.outputs.commit }}
          path: deepseek-harness

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          architecture: ${{ matrix.node_arch }}
          cache: pnpm

      - name: Assert native runner architecture
        run: |
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Install DSH Stack dependencies
        run: pnpm install --frozen-lockfile

      - name: Install official Harness dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Load Reference package-size baseline
        run: |
          baseline=$(node -e "process.stdout.write(String(require('./docs/package-size-report.json').baseline.totalBytes))")
          echo "DSH_STACK_SIZE_BASELINE_BYTES=$baseline" >> "$GITHUB_ENV"

      - name: Build official Harness packages
        working-directory: deepseek-harness
        run: pnpm run build

      - name: Initialize official web Profile
        working-directory: deepseek-harness
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: CI=true pnpm dsh web --dump-default-config >/dev/null

      - name: Freeze → Verify → Materialize → Package
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/deepseek-harness
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DSH_STACK_ARCH: ${{ matrix.arch }}
          DSH_STACK_OUTPUT_DIR: ${{ github.workspace }}/dist/release/${{ matrix.arch }}
          DSH_STACK_TRACE: '1'
          DSH_STACK_STORAGE_ID: dsh-web-5590c2a0cb00b3a7
          DSH_STACK_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/update-manifest.json
          DSH_STACK_UPDATE_CHANNEL: rc
          DSH_STACK_RELEASE_REPO: ${{ github.repository }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            export DSH_STACK_APP_VERSION="${GITHUB_REF_NAME#v}"
            export DSH_STACK_RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          bash scripts/build-macos-reference.sh

      - name: Upload unsigned/ad-hoc validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-desktop-unofficial-macos-${{ matrix.arch }}
          path: dist/release/${{ matrix.arch }}
          if-no-files-found: error


  publish_reference_release:
    name: Publish macOS Reference Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deepseek-desktop-unofficial-macos-*
          path: dist/release

      - name: Merge architecture update manifest
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          node scripts/merge-update-manifest.mjs \
            --dist dist/release/deepseek-desktop-unofficial-macos-x64 \
            --dist dist/release/deepseek-desktop-unofficial-macos-arm64 \
            --tag "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --channel rc \
            --out dist/release/update-manifest.json

      - name: Create non-prerelease and upload verified distribution assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DeepSeek Desktop ${tag#v} (Unofficial Reference RC)" \
            --latest \
            --notes "DeepSeek Desktop ${tag#v} is an unofficial Reference / RC distribution powered by DSH Stack. Download the DMG matching your Mac: Intel x86_64 or Apple Silicon arm64. These artifacts are ad-hoc signed until Apple Developer signing and notarization are available."

          while IFS= read -r -d '' asset; do
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          done < <(find dist/release -mindepth 2 -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.dmg.sha256' -o -name '*verification.receipt.json' -o -name '*package-size-report.json' \) -print0 | sort -z)
          gh release upload "$tag" dist/release/update-manifest.json --clobber --repo "$GITHUB_REPOSITORY"
