name: Harness Update Check

# Scheduled upstream monitoring for the official DeepSeek Harness:
#
#   - daily read-only `dsh-stack harness-check` against the configured upstream ref
#   - UPDATE_AVAILABLE -> keep one labeled tracking issue open (auto-created,
#     refreshed while the update is pending, auto-closed when up to date)
#   - UP_TO_DATE -> green run, no issue
#   - UNAVAILABLE -> the monitor itself is broken; the job fails
#
# The workflow never runs `harness-update --apply`. Applying an upstream
# candidate stays an explicit, locally verified maintainer decision
# (docs/harness-update.md).
#
# Scheduled runs only execute from the default branch.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Official Harness upstream ref to check (branch or tag)'
        required: false
        default: 'master'

permissions:
  contents: read
  issues: write

concurrency:
  group: harness-update-check
  cancel-in-progress: false

jobs:
  check:
    name: Check official Harness upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout DSH Stack
        uses: actions/checkout@v4

      - name: Load current Harness pin
        id: harness-pin
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pin = JSON.parse(fs.readFileSync('config/harness-pin.json', 'utf8'))
          if (pin.schemaVersion !== 1 || !/^[0-9a-f]{40}$/.test(pin.commit) || typeof pin.repository !== 'string' || typeof pin.version !== 'string' || typeof pin.upstreamRef !== 'string' || pin.upstreamRef.length === 0) {
            throw new Error('config/harness-pin.json is invalid')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            'repository=' + pin.repository,
            'version=' + pin.version,
            'commit=' + pin.commit,
            'upstreamRef=' + pin.upstreamRef,
          ].join('\n') + '\n')
          NODE

      - name: Resolve Harness upstream ref
        env:
          DISPATCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref || '' }}
          PIN_REF: ${{ steps.harness-pin.outputs.upstreamRef }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_REF" ]; then
            echo "HARNESS_UPSTREAM_REF=$DISPATCH_REF" >> "$GITHUB_ENV"
          else
            echo "HARNESS_UPSTREAM_REF=$PIN_REF" >> "$GITHUB_ENV"
          fi

      - name: Checkout current official Harness pin (shallow)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.harness-pin.outputs.repository }}
          ref: ${{ steps.harness-pin.outputs.commit }}
          path: deepseek-harness
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install DSH Stack dependencies
        run: pnpm install --frozen-lockfile

      - name: Run harness-check
        run: |
          set +e
          pnpm dsh-stack harness-check deepseek-harness --remote origin --ref "$HARNESS_UPSTREAM_REF" --json \
            > harness-check.raw.out 2> harness-check.stderr
          CHECK_EXIT=$?
          set -e
          # Keep only the outermost JSON object; pnpm may prefix non-JSON output.
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("harness-check.raw.out", "utf8");
            const start = raw.indexOf("{");
            const end = raw.lastIndexOf("}");
            if (start === -1 || end === -1 || end < start) {
              console.error("harness-check produced no JSON object on stdout");
              process.exit(1);
            }
            const report = JSON.parse(raw.slice(start, end + 1));
            const known = new Set(["UP_TO_DATE", "UPDATE_AVAILABLE", "UNAVAILABLE"]);
            if (!known.has(report.status)) {
              console.error(`Unexpected harness-check status: ${report.status}`);
              process.exit(1);
            }
            fs.writeFileSync("harness-check.json", `${JSON.stringify(report, null, 2)}\n`);
          '
          if [ "$(node -p "require('./harness-check.json').status")" = "UNAVAILABLE" ]; then
            cat harness-check.stderr >&2 || true
            echo "harness-check returned UNAVAILABLE (exit $CHECK_EXIT); the monitor itself is broken." >&2
            exit 1
          fi

      - name: Sync tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node scripts/harness-update-issue.mjs \
            --check harness-check.json \
            --ref "$HARNESS_UPSTREAM_REF" \
            --run-url "$RUN_URL" \
            --out-dir . \
            --summary >> "$GITHUB_STEP_SUMMARY"
          STATUS=$(node -p "require('./harness-check.json').status")

          gh label create harness-update \
            --description "Official Harness upstream update tracking" \
            --color 1D76DB 2>/dev/null || true
          OPEN_ISSUES=$(gh issue list --label harness-update --state open --limit 100 --json number,title)
          ISSUE_NUMBER=$(node - "$OPEN_ISSUES" "$HARNESS_UPSTREAM_REF" <<'NODE'
          const issues = JSON.parse(process.argv[2])
          const ref = process.argv[3]
          const matches = issues.filter(issue => issue.title.startsWith(`Harness update available [${ref}]:`))
          if (matches.length > 1) {
            console.error(`More than one open Harness update issue exists for ${ref}. Resolve duplicates before retrying.`)
            process.exit(1)
          }
          process.stdout.write(matches[0] === undefined ? '' : String(matches[0].number))
          NODE
          )

          if [ "$STATUS" = "UPDATE_AVAILABLE" ]; then
            if [ -z "$ISSUE_NUMBER" ]; then
              gh issue create \
                --title "$(cat harness-issue-title.txt)" \
                --label harness-update \
                --body-file harness-issue-body.md
            else
              gh issue edit "$ISSUE_NUMBER" \
                --title "$(cat harness-issue-title.txt)" \
                --body-file harness-issue-body.md
            fi
          elif [ "$STATUS" = "UP_TO_DATE" ] && [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file harness-issue-close-comment.txt
            gh issue close "$ISSUE_NUMBER"
          fi
